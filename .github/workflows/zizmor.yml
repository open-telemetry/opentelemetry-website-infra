name: Zizmor GitHub Actions Security Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 3 * * 1' # weekly at 03:31 (UTC) on Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor Security Analysis
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@30362d425ab746bb2ec4647538ea9154591cce91 # v0.22.0
